<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10283f">
<title>شهادات شكر وتقدير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10283f;--navy2:#193c59;--gold:#bd984d;--ink:#263344;--muted:#687789;--white:#fff;--danger:#a33333;--success:#22664b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#f8fafc 0,#edf1f5 65%);color:var(--ink);font-family:"Cairo",sans-serif;min-height:100vh;padding:34px 16px 56px}
.wrap{width:min(100%,900px);margin:auto;display:grid;gap:22px}
header{text-align:center;padding:8px 12px 2px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#947332;font-size:13px;font-weight:800}
.eyebrow:before,.eyebrow:after{content:"";width:28px;height:1px;background:var(--gold)}
h1{font-family:"Reem Kufi","Cairo",sans-serif;color:var(--navy);font-size:clamp(27px,5vw,42px);line-height:1.35;margin:8px 0}
.lead{color:var(--muted);margin:0}
.panel{background:var(--white);border:1px solid #e0e6ec;border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 14px 38px #193c5910}
.form-title{font-weight:800;color:var(--navy);margin:0 0 14px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.field input{width:100%;height:51px;border:1px solid #d7dfe7;border-radius:11px;background:#f9fbfd;padding:0 14px;font:inherit;color:var(--ink);outline:none;transition:.2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #bd984d22}
.actions{display:flex;gap:10px;margin-top:16px}
button{font:inherit;cursor:pointer}
.primary,.secondary{border:0;border-radius:11px;padding:12px 22px;font-weight:800;transition:transform .15s,opacity .15s}
.primary{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;box-shadow:0 7px 16px #10283f25;flex:1}
.secondary{background:#f3f5f7;color:var(--navy);border:1px solid #dfe5eb}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait;transform:none}
.message{min-height:25px;margin:12px 0 0;font-size:14px;font-weight:700;color:var(--danger)}
.message.ok{color:var(--success)}
.hint{color:var(--muted);font-size:12px;margin:10px 0 0}
.certificate{display:none}
.certificate.show{display:block}
#certCanvas{display:block;width:100%;height:auto;aspect-ratio:1122/794;border-radius:6px;box-shadow:0 18px 48px #10283f30;background:#fff}
.pdf-row{display:none;text-align:center}.pdf-row.show{display:block}
.pdf{background:var(--gold);color:#fff;border:0;border-radius:11px;padding:12px 25px;font-weight:800}
.foot{text-align:center;color:#8793a0;font-size:12px}
@media(max-width:620px){.actions{flex-direction:column}}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{width:297mm;height:210mm;margin:0;padding:0;background:white!important}
 body{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 header,.panel,.pdf-row,.foot{display:none!important}
 .wrap{display:block;width:297mm;height:210mm;margin:0}
 .certificate.show{display:block!important}
 #certCanvas{width:297mm;height:210mm;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>
<main class="wrap">
 <header>
  <div class="eyebrow">التميز يستحق التقدير</div>
  <h1>شهادات شكر وتقدير</h1>
  <p class="lead">تهانينا لأبنائنا الطلاب الحاصلين على الدرجة النهائية</p>
 </header>

 <section class="panel" aria-label="البحث عن الشهادة">
  <p class="form-title">ابحث عن شهادتك</p>
  <form id="lookupForm" autocomplete="off">
   <div class="field"><label for="studentName">اسم الطالب الثلاثي</label><input id="studentName" name="studentName" type="text" placeholder="اكتب اسمك الثلاثي كما هو مسجل" required maxlength="100" autocomplete="name"></div>
   <div class="actions"><button class="primary" id="searchBtn" type="submit">عرض الشهادة</button><button class="secondary" id="clearBtn" type="button">مسح البيانات</button></div>
   <p class="message" id="message" role="status" aria-live="polite"></p>
   <p class="hint">اكتبي الاسم الثلاثي كاملًا كما تم تسجيله.</p>
  </form>
 </section>

 <section class="certificate" id="certificate" aria-label="شهادة شكر وتقدير">
  <canvas id="certCanvas" width="2244" height="1588"></canvas>
 </section>
 <div class="pdf-row" id="pdfRow"><button class="pdf" id="printBtn" type="button">تحميل الشهادة PDF</button></div>
 <div class="foot">مع أطيب التمنيات بدوام النجاح والتفوق</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";

const SUPABASE_URL = "https://yisgyqozrsjbylpumjox.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IOPSc-va9Y20fcE7HQHKEQ_8HCI_4jn";
const LOOKUP_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/lookup-certificate`;

const CONFIG = {
  exam: "امتحان شهر أكتوبر",
  subject: "الحاسب الآلي",
  term: "أكتوبر",
  year: "٢٠٢٦",
  teacher: "م. أسماء مجدي"
};

const $ = id => document.getElementById(id);
const form = $("lookupForm");
const message = $("message");
const certificate = $("certificate");
const pdfRow = $("pdfRow");
const searchBtn = $("searchBtn");
const canvas = $("certCanvas");

function hideCertificate() {
  certificate.classList.remove("show");
  pdfRow.classList.remove("show");
}
function showMessage(text, success=false) {
  message.textContent = text;
  message.classList.toggle("ok", success);
}
function hideMessage() { showMessage(""); }

let failures = 0;
let lockUntil = 0;
try {
  const state = JSON.parse(sessionStorage.getItem("certificate-attempts") || "{}");
  failures = Number(state.failures) || 0;
  lockUntil = Number(state.lockUntil) || 0;
} catch (_) {}

function saveAttemptState() {
  try { sessionStorage.setItem("certificate-attempts", JSON.stringify({failures, lockUntil})); } catch (_) {}
}

/* ============================================================
   رسم الشهادة على Canvas (نفس الصورة تظهر على الشاشة وفي الـ PDF)
   ============================================================ */
const CW = 1122, CH = 794, SCALE = 2;
const GOLD = "#c9a24f";

function wrapLines(ctx, text, maxWidth) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* موجة زرقاء وذهبية في الزاوية. (tx,ty) الزاوية، sx/sy اتجاه الداخل */
function drawSwoosh(ctx, tx, ty, sx, sy, a, b) {
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(sx, sy);

  // الشريط الذهبي
  const g = ctx.createLinearGradient(0, 0, a, b);
  g.addColorStop(0, "#f7ecc4");
  g.addColorStop(0.5, "#d4ac55");
  g.addColorStop(1, "#f3e1a4");
  ctx.beginPath();
  ctx.moveTo(a * 1.1, 0);
  ctx.bezierCurveTo(a * 0.66, b * 0.015, a * 0.1, b * 0.5, 0, b * 1.16);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();

  // الجزء الأزرق
  const n = ctx.createLinearGradient(0, 0, a * 0.7, b * 0.9);
  n.addColorStop(0, "#041636");
  n.addColorStop(0.55, "#0b5384");
  n.addColorStop(1, "#08254a");
  ctx.beginPath();
  ctx.moveTo(a, 0);
  ctx.bezierCurveTo(a * 0.6, b * 0.035, a * 0.16, b * 0.38, 0, b);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fillStyle = n;
  ctx.fill();

  // خط ذهبي رفيع داخل الموجة
  ctx.beginPath();
  ctx.moveTo(a * 0.82, 0);
  ctx.bezierCurveTo(a * 0.5, b * 0.06, a * 0.12, b * 0.4, 0, b * 0.88);
  ctx.strokeStyle = "rgba(233,205,128,.85)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

/* زخرفة الزاوية الذهبية */
function drawCornerOrnament(ctx, x, y, sx, sy) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sx, sy);
  ctx.strokeStyle = GOLD;
  ctx.lineCap = "round";
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(270, 0); ctx.lineTo(0, 0); ctx.lineTo(0, 300); ctx.stroke();
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(250, 9); ctx.lineTo(9, 9); ctx.lineTo(9, 280); ctx.stroke();
  // لفّات زخرفية
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(38, 38, 15, Math.PI * 0.1, Math.PI * 1.7); ctx.stroke();
  ctx.beginPath(); ctx.arc(38, 38, 6, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(53, 40); ctx.bezierCurveTo(70, 52, 78, 30, 100, 36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, 53); ctx.bezierCurveTo(52, 70, 30, 78, 36, 100); ctx.stroke();
  ctx.fillStyle = GOLD;
  [[100, 36, 0.3], [36, 100, 1.27]].forEach(([lx, ly, rot]) => {
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(8, 0, 9, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

/* الميدالية بالشريط */
function drawMedal(ctx, cx, cy) {
  ctx.fillStyle = "#08204a";
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1.6;
  const bottom = CH - 24;
  [-1, 1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(cx + s * 40, cy + 28);
    ctx.lineTo(cx + s * 8, cy + 44);
    ctx.lineTo(cx + s * 38, bottom);
    ctx.lineTo(cx + s * 76, bottom);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  });
  // الحافة المسننة
  const rg = ctx.createRadialGradient(cx, cy, 10, cx, cy, 58);
  rg.addColorStop(0, "#f7e9b6"); rg.addColorStop(1, "#c9a24f");
  ctx.beginPath();
  for (let i = 0; i <= 360; i += 2) {
    const ang = i * Math.PI / 180;
    const r = 54 + 3.6 * Math.cos(ang * 22);
    const px = cx + r * Math.cos(ang), py = cy + r * Math.sin(ang);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = rg; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 44, 0, Math.PI * 2);
  ctx.fillStyle = "#d9b560"; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 38, 0, Math.PI * 2);
  ctx.fillStyle = "#061a3d"; ctx.fill();
  ctx.strokeStyle = "#e4c677"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 31, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#e9cf86";
  ctx.font = '700 26px Cairo, sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("★", cx, cy + 1);
}

function drawCertificate(data) {
  const ctx = canvas.getContext("2d");
  canvas.width = CW * SCALE;
  canvas.height = CH * SCALE;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  ctx.direction = "rtl";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  try { ctx.letterSpacing = "0px"; ctx.wordSpacing = "0px"; } catch (_) {}
  const cx = CW / 2;

  // الخلفية
  ctx.fillStyle = "#fffefa";
  ctx.fillRect(0, 0, CW, CH);

  // الموجات
  drawSwoosh(ctx, 0, 0, 1, 1, CW * 0.40, 335);
  drawSwoosh(ctx, CW, CH, -1, -1, CW * 0.44, 290);

  // زخارف الزوايا
  drawCornerOrnament(ctx, CW - 40, 40, -1, 1);
  drawCornerOrnament(ctx, 40, CH - 40, 1, -1);

  // العنوان بخط الرقعة
  ctx.font = '700 92px "Aref Ruqaa", Amiri, serif';
  ctx.fillStyle = "#0e1a33";
  ctx.fillText("شكر وتقدير", cx, 150);

  // الفاصل الذهبي
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - 170, 214); ctx.lineTo(cx - 24, 214);
  ctx.moveTo(cx + 24, 214); ctx.lineTo(cx + 170, 214);
  ctx.stroke();
  ctx.save(); ctx.translate(cx, 214); ctx.rotate(Math.PI / 4);
  ctx.strokeRect(-6, -6, 12, 12);
  ctx.fillStyle = GOLD; ctx.fillRect(-2.5, -2.5, 5, 5);
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx - 40, 222, 9, Math.PI, Math.PI * 1.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 40, 222, 9, Math.PI * 1.1, 0); ctx.stroke();

  // جملة الشكر
  ctx.fillStyle = "#1c1c1c";
  ctx.font = '600 25px Cairo, sans-serif';
  ctx.fillText(`تتقدم معلمة الحاسب الآلي ${data.teacher} بجزيل الشكر والتقدير`, cx, 266);

  // للطالب / ة
  ctx.fillStyle = "#b8903c";
  ctx.font = '800 28px Cairo, sans-serif';
  ctx.fillText("للطالب / ة", cx, 320);

  // الاسم
  let size = 48;
  ctx.font = `700 ${size}px Amiri, serif`;
  while (ctx.measureText(data.name).width > CW * 0.62 && size > 26) {
    size -= 2; ctx.font = `700 ${size}px Amiri, serif`;
  }
  ctx.fillStyle = "#0e1a33";
  ctx.fillText(data.name, cx, 372);
  // خط منقّط
  const lw = Math.max(ctx.measureText(data.name).width + 90, 420);
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
  ctx.setLineDash([2, 5]); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - lw / 2, 404); ctx.lineTo(cx + lw / 2, 404); ctx.stroke();
  ctx.setLineDash([]);

  // نص التقدير
  ctx.font = '500 23px Cairo, sans-serif';
  ctx.fillStyle = "#222";
  const lines = wrapLines(ctx, data.reason, CW * 0.68);
  const lh = 40;
  lines.forEach((ln, i) => ctx.fillText(ln, cx, 452 + i * lh));

  // التاريخ والتوقيع
  const dx = CW * 0.72, sxp = CW * 0.28;
  ctx.fillStyle = "#b8903c";
  ctx.font = '800 24px Cairo, sans-serif';
  ctx.fillText("التاريخ", dx, 664);
  ctx.fillText("التوقيع", sxp, 664);
  ctx.fillStyle = "#33302a";
  ctx.font = '600 19px Cairo, sans-serif';
  ctx.fillText(data.date, dx, 700);
  ctx.fillText(data.teacher, sxp, 700);

  // الميدالية
  drawMedal(ctx, cx, 668);

  // إطار خفيف حول الصفحة
  ctx.strokeStyle = "#e6dfcb"; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, CW - 2, CH - 2);
}

async function renderCertificate(studentName) {
  const data = {
    name: studentName,
    teacher: CONFIG.teacher,
    reason: `وذلك تقديرًا للاجتهاد والتميّز وتحقيق الدرجة النهائية في مادة ${CONFIG.subject} — ${CONFIG.exam} ${CONFIG.year}، وللحرص على التعلّم والمشاركة الفعّالة. سائلين الله لكم دوام التوفيق والنجاح، وأن يبارك لكم فيما تعلّمتم ويرزقكم الإخلاص والثبات.`,
    date: new Intl.DateTimeFormat("ar-EG", {day:"numeric", month:"long", year:"numeric"}).format(new Date())
  };

  // تحميل الخطوط فعليًا قبل الرسم
  const sample = "شكر وتقدير الطالب أسماء ٠١٢٣٤٥٦٧٨٩ ★ " + data.name + data.reason;
  try {
    await Promise.all([
      document.fonts.load('700 92px "Aref Ruqaa"', sample),
      document.fonts.load('700 48px Amiri', sample),
      document.fonts.load('500 23px Cairo', sample),
      document.fonts.load('600 25px Cairo', sample),
      document.fonts.load('700 26px Cairo', sample),
      document.fonts.load('800 24px Cairo', sample)
    ]);
    await document.fonts.ready;
  } catch (_) {}

  drawCertificate(data);
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  hideCertificate();
  hideMessage();

  if (Date.now() < lockUntil) {
    showMessage("تم إيقاف المحاولة مؤقتًا. انتظري قليلًا ثم حاولي مرة أخرى.");
    return;
  }

  const enteredName = $("studentName").value.trim().replace(/\s+/g, " ");
  if (!enteredName) { showMessage("من فضلك اكتبي الاسم الثلاثي."); return; }
  if (enteredName.length > 100) { showMessage("الاسم أطول من المسموح. راجعي الاسم وحاولي مرة أخرى."); return; }

  searchBtn.disabled = true;
  searchBtn.textContent = "جارٍ التحقق…";

  try {
    const response = await fetch(LOOKUP_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY },
      body: JSON.stringify({ name: enteredName })
    });

    const result = await response.json().catch(() => ({}));

    if (response.status === 404) {
      failures++;
      if (failures >= 5) lockUntil = Date.now() + Math.min(30000 * (failures - 4), 300000);
      saveAttemptState();
      showMessage("لم يتم العثور على شهادة بهذا الاسم. راجعي كتابة الاسم الثلاثي.");
      return;
    }

    if (!response.ok) throw new Error("تعذر التحقق من الشهادة الآن.");

    const studentName = result?.student?.name;
    if (!studentName) throw new Error("استجابة التحقق غير مكتملة.");

    failures = 0; lockUntil = 0; saveAttemptState();

    await renderCertificate(studentName);
    certificate.classList.add("show");
    pdfRow.classList.add("show");
    showMessage("تم التحقق بنجاح. مبارك التفوق!", true);
    certificate.scrollIntoView({behavior:"smooth", block:"center"});
  } catch (error) {
    showMessage(error.message || "حدث خطأ في الاتصال. حاولي مرة أخرى.");
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = "عرض الشهادة";
  }
});

$("clearBtn").addEventListener("click", () => {
  form.reset();
  hideCertificate();
  hideMessage();
  $("studentName").focus();
});

$("printBtn").addEventListener("click", () => {
  if (!certificate.classList.contains("show")) { showMessage("اعرضي الشهادة أولًا."); return; }

  const button = $("printBtn");
  button.disabled = true;
  button.textContent = "جارٍ تجهيز الشهادة...";

  try {
    if (!window.jspdf || typeof window.jspdf.jsPDF !== "function") {
      throw new Error("مكتبة PDF لم تُحمّل. تأكدي من الإنترنت ثم حدّثي الصفحة.");
    }
    const imageData = canvas.toDataURL("image/jpeg", 0.95);
    const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4", compress: true });
    pdf.addImage(imageData, "JPEG", 0, 0, 297, 210, undefined, "FAST");

    const studentName = $("studentName").value.trim() || "الطالب";
    const safeName = studentName.replace(/[\\/:*?"<>|]/g, "-").slice(0, 70);
    pdf.save(`شهادة-${safeName}.pdf`);
    showMessage("تم إنشاء ملف الشهادة. على الهاتف اختاري حفظ في الملفات إذا ظهرت معاينة PDF.", true);
  } catch (error) {
    console.error("PDF download error:", error);
    showMessage("تعذر تحميل الشهادة: " + (error && error.message ? error.message : "حاولي مرة أخرى."));
  } finally {
    button.disabled = false;
    button.textContent = "تحميل الشهادة PDF";
  }
});

document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
